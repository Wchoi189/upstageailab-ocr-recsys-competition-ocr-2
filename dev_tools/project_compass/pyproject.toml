[project]
name = "project-compass"
version = "3.0.1"
description = "Project Compass V3 - Skills-First Vessel Pulse Management"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
compass = "project_compass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_compass"]
