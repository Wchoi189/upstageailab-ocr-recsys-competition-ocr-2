name: ocr-debugging
title: OCR Debugging & AST Analysis
ads_version: '1.0'
scope: project
description: AST-based debugging tools for Hydra config and component analysis
tags:
- debugging
- ast
- hydra
- config
triggers:
  keywords:
  - debug
  - troubleshoot
  - trace
  - merge order
  - config access
  - ast
tiers:
  tier1:
    name: Core Analyzers
    max_files: 4
    files:
    - path: dev_tools/agent_debug_toolkit/src/agent_debug_toolkit/analyzers/config_access.py
      priority: critical
      mode: structure
      description: Config access patterns
    - path: dev_tools/agent_debug_toolkit/src/agent_debug_toolkit/analyzers/hydra_usage.py
      priority: critical
      mode: structure
      description: Hydra pattern detection
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: high
      mode: reference
      description: Tool catalog
  tier2:
    name: Advanced Analysis
    max_files: 6
    files:
    - path: dev_tools/agent_debug_toolkit/src/agent_debug_toolkit/analyzers/merge_order.py
      priority: high
      mode: structure
      description: OmegaConf merge tracer
    - path: dev_tools/agent_debug_toolkit/src/agent_debug_toolkit/analyzers/instantiation.py
      priority: high
      mode: structure
      description: Component instantiation tracker
    - path: AgentQMS/specs/tier2-framework/constraints.spec.md
      priority: medium
      mode: reference
      description: Validation constraints
  tier3:
    name: Framework Specs
    max_files: 6
    files:
    - path: dev_tools/agent_debug_toolkit/README.md
      priority: low
      mode: reference
      description: Toolkit documentation
    - path: AgentQMS/specs/tier2-framework/ocr-engine.spec.md
      priority: low
      mode: reference
      description: OCR engine standards
    - path: AgentQMS/specs/tier2-framework/configuration.spec.md
      priority: low
      mode: reference
      description: Config management
    - path: AgentQMS/specs/tier2-framework/patterns.spec.md
      priority: low
      mode: reference
      description: Design patterns
