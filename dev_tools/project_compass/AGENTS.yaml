# PROJECT COMPASS AI-INTERFACE V3.0
# CONSUMPTION: ~40 Tokens (optimized from v2.x)
# PROTOCOL: Use /compass-* skills as primary interface. CLI for automation only.
# ARCHITECTURE: Simplified path detection, MCP layer removed, skills-first design.
# CHANGELOG: V3.0 nuclear cleanup complete. See CHANGELOG.md.

rules:
  - "Environment: Only use UV. Never overwrite Torch 2.6.0+cu124."
  - "State: `.vessel/vessel_state.json` is the Single Source of Truth."
  - "Protocol: Follow [Pulse Lifecycle] in AGENTS.md. `pulse_staging/artifacts/` is the ONLY write location."
  - "Nomenclature: Use Skills (`/compass-*`) for interactive work. CLI (`uv run compass`) for scripts."
  - "Compass Sync: State is auto-managed. Do not edit JSON files manually."

# PRIMARY INTERFACE: Skills (Interactive Work)
primary_interface:
  compass_start: "/compass-start [pulse-id] \"[objective]\" [milestone-id] - Initialize pulse"
  compass_status: "/compass-status - Check current state"
  compass_register: "/compass-register [filename] [type] - Register artifact"
  compass_finish: "/compass-finish - Export pulse"
  compass_resume: "/compass-resume - Load session context"
  compass_help: "/compass-help - Command reference"
  audit_run: "/audit-run [category] - Execute audit"

# AUTOMATION INTERFACE: CLI (Scripts Only)
automation_interface:
  check_env: "uv run compass check-env"
  pulse_init: "uv run compass pulse-init --id {domain-action-target} --obj {objective} --milestone {id}"
  pulse_status: "uv run compass pulse-status"
  pulse_sync: "uv run compass pulse-sync --path {relative_path} --type {artifact_type}"
  pulse_export: "uv run compass pulse-export"
  pulse_checkpoint: "uv run compass pulse-checkpoint --burden {low|medium|high}"

schema_root: "project_compass/src/state_schema.py"  # Python package (code only)

# DEPRECATION NOTICE
deprecated:
  mcp_tools: "Removed in v3.0. Use Skills or CLI."
  spec_kit: "Removed in v3.0. Spec-kit commands deleted."
  snapshots: "Removed in v3.0. Use git commits for checkpoints."
