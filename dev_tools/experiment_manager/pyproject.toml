[project]
name = "experiment-manager"
version = "0.1.0"
description = "Experiment Tracker Kit (ETK) for managing AI experiments"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0"
]

[project.scripts]
etk = "etk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etk"]
