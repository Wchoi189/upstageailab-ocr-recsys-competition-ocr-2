# @package _global_

# Hardware capabilities
hardware:
  gpu: "rtx3090"
  vram: "24gb"
  cpu: "high_perf"

# Trainer optimization
trainer:
  accumulate_grad_batches: 1        # 3090 has enough VRAM for large batches, less need for accomulation
  precision: "32-true"             # Use AMP/Telemtry
  gradient_clip_val: 5.0
  max_epochs: 200
  benchmark: true
  accelerator: gpu
  devices: 1
  strategy: auto

# Dataloader optimization
dataloaders:
  train_dataloader:
    num_workers: 8                 # Spawn config allows safe scaling
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4             # Aggressive prefetching
  val_dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  test_dataloader:
    num_workers: 4
    pin_memory: true
  predict_dataloader:
    num_workers: 4
    pin_memory: true

# Data Overrides
data:
  batch_size: 38644                  # Optimized for 24GB VRAM
