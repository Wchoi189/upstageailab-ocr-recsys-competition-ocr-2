ads_version: '2.0'
id: WF-040
type: workflow_definition
agent: all
tier: 4
priority: high
validates_with: AgentQMS/standards/schemas/compliance-checker.py
compliance_status: unknown
memory_footprint: 90
keywords:
- validation
- compliance
- workflow
- runbook
fuzzy_threshold: 0.8
description: Execution runbook for validation and discovery commands
workflows:
  validation_commands:
    validate:
      command: make qms-validate ARGS="--all"
      alternative: aqms validate --all
      purpose: Validate all artifacts starting from configured root
      frequency: After EVERY artifact operation
      usage_notes: |
        If artifacts are outside docs/artifacts/, use:
        make qms-validate ARGS="--artifacts-root <path> --all"
        OR
        aqms validate --artifacts-root <path> --all
      failure: BLOCK - Fix before proceeding
    compliance:
      command: make qms-compliance
      alternative: aqms artifact check-compliance
      purpose: Check AgentQMS framework compliance
      frequency: Before commits
      failure: BLOCK - Address violations
    boundary:
      command: make qms-boundary
      purpose: Verify framework boundaries
      frequency: Weekly or after major changes
      failure: WARN - Review boundaries
  discovery_commands:
    help:
      command: make help
      purpose: Show available make targets including QMS commands
    discover:
      command: make qms-discover
      alternative: uv run python AgentQMS/tools/core/plugins/discovery.py
      purpose: List all AgentQMS tools
    status:
      command: make qms-status
      alternative: aqms monitor --report
      purpose: Check framework status
  workflow_sequence:
  - Create artifact via make create-*
  - Automatic validation runs
  - Review validation output
  - Fix any violations
  - Re-validate until pass
  - Proceed to next operation
  failure_handling:
  - STOP all operations
  - Read validation error messages
  - Fix identified issues
  - Re-run validation
  - Do NOT proceed until pass
