name: ocr-dev
# Default `docker compose up -d` (incl. Dockge's Start button) brings up ONLY
# ocr-dev. postgres+redis+litellm and rabbitmq are opt-in via --profile:
#   docker compose --profile llm up -d     # postgres, redis, litellm
#   docker compose --profile queue up -d   # rabbitmq
#   docker compose --profile llm --profile queue up -d   # everything
# redis lives in the "llm" profile (not "queue") because litellm depends_on
# redis with a healthcheck condition and litellm.env sets REDIS_HOST=redis --
# litellm will not start without it. See MAINTENANCE.md 2026-07-25 entry.
services:
  ocr-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ocr-dev
    container_name: ocr-recsys-dev
    hostname: ocr-dev
    restart: unless-stopped
    volumes:
      # 2026-07-25: migrated off WSL2/Docker Desktop to native Linux.
      # Old /data (WSL2-side mount) -> new /mnt/projects (native mount of the
      # same VHDX-backed drive). See knowledge-base/decisions in agentic-workspace
      # for the container-recovery ADR.
      - /mnt/projects/upstageailab-ocr-recsys-competition-ocr-2:/workspaces:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.ssh:/home/vscode/.ssh-mount
      - /mnt/projects:/parent:cached
      # 2026-07-25: dropped, source path (/data/project-artifacts/ocr-external-storage)
      # did not survive the migration. entrypoint.sh handles this mount being absent
      # gracefully (`if [ -d "$SOURCE_ROOT" ]`), so this is safe to leave commented
      # out until the data is located/recovered.
      # - /mnt/projects/project-artifacts/ocr-external-storage:/mnt/external_artifacts:cached

      # Persist /home/vscode for IDE state (Antigravity, Copilot, shell history, etc.)
      # This includes: .vscode-server, .cache, .local, .config, .pyenv, .npm, etc.
      - vscode_home:/home/vscode

      # Anonymous volumes for node_modules to avoid performance issues and host syncing
      - /workspaces/node_modules
      - /workspaces/apps/ocr_inference_console/node_modules
      - /workspaces/apps/playground-console/node_modules
      - /workspaces/apps/agentqms-dashboard/frontend/node_modules
      - /workspaces/apps/mcp-visibility-extension/node_modules
    working_dir: /workspaces
    environment:
      - DISPLAY=${DISPLAY}
      - UV_LINK_MODE=copy
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - OCR_PROJECT_ROOT=/workspaces
    ports:
      - "8000:8000" # Web interface/API
      - "8501:8501" # Streamlit (if used)
      - "6006:6006" # TensorBoard
      - "2223:22" # SSH
      - "5173:5173" # Vite dev server
      # - "3000:3000" # React dev server
    # Uncomment for GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    shm_size: '8gb' # Set shared memory size for DataLoader workers
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ocr-rabbitmq
    hostname: rabbitmq
    profiles: [ "queue" ]
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest

      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - default
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    hostname: redis
    profiles: [ "llm" ]
    ports:
      - "6379:6379"
    # Configured for low-latency virtual state storage
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5


  postgres:
    image: postgres:16-alpine
    container_name: ocr-postgres
    hostname: postgres
    restart: unless-stopped
    profiles: [ "llm" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr_password}
      POSTGRES_DB: ${POSTGRES_DB:-ocr_stt}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
      shared-db:
        aliases:
          - ocr-postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr_user} -d ${POSTGRES_DB:-ocr_stt}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    profiles: [ "llm" ]
    ports:
      - "4000:4000"
    networks:
      - default
      - shared-db
    env_file:
      - litellm.env
    # 2026-07-26: prod_entrypoint.sh's default CMD is just `--port 4000` -- it
    # does NOT auto-detect /app/config.yaml. Without this, config.yaml was
    # silently ignored (confirmed via empty /v1/models response).
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    volumes:
      # Mount the config from the LLM project directory
      - /parent/LLM/litellm/proxy_server_config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  codescene:
  redis_data:
  postgres_data:
  vscode_home:  # Persists /home/vscode across container resets

networks:
  # Attach external compose stacks by setting this network as external.
  # Example in another compose file:
  # networks:
  #   shared-db:
  #     external: true
  #     name: ocr-shared-db-net
  shared-db:
    name: ocr-shared-db-net
    driver: bridge
