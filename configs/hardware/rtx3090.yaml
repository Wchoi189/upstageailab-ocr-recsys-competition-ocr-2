# @package _global_

# Hardware capabilities
hardware:
  gpu: "rtx3090"
  vram: "24gb"
  cpu: "high_perf"

# Trainer optimization
trainer:
  accumulate_grad_batches: 1
  precision: "16-mixed"             # standard for RTX 30 series
  gradient_clip_val: 5.0
  max_epochs: 100
  benchmark: true
  accelerator: gpu
  devices: 1
  strategy: auto

# Dataloader optimization
dataloaders:
  train_dataloader:
    num_workers: 12                # Optimized for 16-core CPU (75% usage)
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4             # Optimized for high throughput
    batch_size: 160                # Optimized for 24GB VRAM
  val_dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    batch_size: 160
  test_dataloader:
    num_workers: 8
    pin_memory: true
    batch_size: 160
  predict_dataloader:
    num_workers: 8
    pin_memory: true
    batch_size: 160

# Data Overrides
data:
  batch_size: 160

