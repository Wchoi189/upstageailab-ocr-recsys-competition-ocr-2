mode: train
global:
  paths:
    root_dir: .
    data_dir: /workspaces/project-artifacts/ocr-external-storage/data
    output_dir: /workspaces/project-artifacts/ocr-external-storage/outputs
    datasets_root: ${global.paths.data_dir}/datasets
    artifacts:
      detection: ${global.paths.output_dir}/detection
      recognition: ${global.paths.output_dir}/recognition
      kie: ${global.paths.output_dir}/kie
    checkpoints: /workspaces/project-artifacts/ocr-external-storage/checkpoints
    logs: /workspaces/project-artifacts/ocr-external-storage/lightning_logs
    wandb: /workspaces/project-artifacts/ocr-external-storage/wandb
    datasets:
      train: ${global.paths.data_dir}/train
      val: ${global.paths.data_dir}/val
      test: ${global.paths.data_dir}/test
    cache: ${global.paths.output_dir}/cache
    temp: ${global.paths.output_dir}/temp
  default_interpolation: 1
  debug: false
trainer:
  max_steps: -1
  max_epochs: 100
  num_sanity_val_steps: 1
  log_every_n_steps: 20
  val_check_interval: null
  check_val_every_n_epoch: 1
  deterministic: false
  accumulate_grad_batches: 2
  precision: 16-mixed
  benchmark: true
  gradient_clip_val: 5.0
  accelerator: gpu
  devices: 1
  strategy: auto
  enable_checkpointing: false
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
dataloaders:
  train_dataloader:
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3
  val_dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  test_dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
  predict_dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 1
hardware:
  gpu: rtx3060
  vram: 12gb
  cpu: i5_16core
data:
  batch_size: 8
  transforms:
    train_transform:
      _target_: ocr.domains.detection.data.transforms.db_transforms.DBTransforms
      transforms:
      - _target_: albumentations.LongestMaxSize
        max_size: 640
        interpolation: ${global.default_interpolation}
        p: 1.0
      - _target_: albumentations.PadIfNeeded
        min_width: 640
        min_height: 640
        border_mode: 0
        position: top_left
        p: 1.0
      - _target_: albumentations.HorizontalFlip
        p: 0.5
      - _target_: albumentations.Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      keypoint_params:
        _target_: albumentations.KeypointParams
        format: xy
        remove_invisible: true
    val_transform:
      _target_: ocr.domains.detection.data.transforms.db_transforms.DBTransforms
      transforms:
      - _target_: albumentations.LongestMaxSize
        max_size: 640
        interpolation: 1
        p: 1.0
      - _target_: albumentations.PadIfNeeded
        min_width: 640
        min_height: 640
        border_mode: 0
        position: top_left
        p: 1.0
      - _target_: albumentations.Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      keypoint_params:
        _target_: albumentations.KeypointParams
        format: xy
        remove_invisible: true
    test_transform:
      _target_: ocr.domains.detection.data.transforms.db_transforms.DBTransforms
      transforms:
      - _target_: albumentations.LongestMaxSize
        max_size: 640
        interpolation: 1
        p: 1.0
      - _target_: albumentations.PadIfNeeded
        min_width: 640
        min_height: 640
        border_mode: 0
        position: top_left
        p: 1.0
      - _target_: albumentations.Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      keypoint_params:
        _target_: albumentations.KeypointParams
        format: xy
        remove_invisible: true
    predict_transform:
      _target_: ocr.domains.detection.data.transforms.db_transforms.DBTransforms
      transforms:
      - _target_: albumentations.LongestMaxSize
        max_size: 640
        interpolation: 1
        p: 1.0
      - _target_: albumentations.PadIfNeeded
        min_width: 640
        min_height: 640
        border_mode: 0
        position: top_left
        p: 1.0
      - _target_: albumentations.Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      keypoint_params: null
  train_num_samples: null
  val_num_samples: null
  test_num_samples: null
  train_dataset:
    _target_: ocr.data.datasets.ValidatedOCRDataset
    config:
      _target_: ocr.core.validation.DatasetConfig
      image_path: ${global.paths.datasets_root}/images/train
      annotation_path: ${global.paths.datasets_root}/jsons/train.json
      cache_config:
        _target_: ocr.core.validation.CacheConfig
        cache_transformed_tensors: false
        cache_images: false
        cache_maps: false
        log_statistics_every_n: null
    transform: ${data.transforms.train_transform}
  val_dataset:
    _target_: ocr.data.datasets.ValidatedOCRDataset
    config:
      _target_: ocr.core.validation.DatasetConfig
      image_path: ${global.paths.datasets_root}/images_val_canonical
      annotation_path: ${global.paths.datasets_root}/jsons/val.json
    transform: ${data.transforms.val_transform}
  test_dataset:
    _target_: ocr.data.datasets.ValidatedOCRDataset
    config:
      _target_: ocr.core.validation.DatasetConfig
      image_path: ${global.paths.datasets_root}/images_val_canonical
      annotation_path: ${global.paths.datasets_root}/jsons/val.json
    transform: ${data.transforms.test_transform}
  predict_dataset:
    _target_: ocr.data.datasets.ValidatedOCRDataset
    config:
      _target_: ocr.core.validation.DatasetConfig
      image_path: ${global.paths.datasets_root}/images/test
      annotation_path: null
    transform: ${data.transforms.test_transform}
  collate_fn:
    _target_: ocr.domains.detection.data.collate_db.DBCollateFN
    shrink_ratio: 0.4
    thresh_min: 0.3
    thresh_max: 0.7
model:
  _target_: ocr.core.models.architecture.OCRModel
  encoder:
    _target_: ocr.core.models.encoder.timm_backbone.TimmBackbone
    model_name: resnet50
    pretrained: true
    output_indices:
    - 1
    - 2
    - 3
    - 4
  decoder:
    _target_: ocr.domains.detection.models.decoders.fpn_decoder.FPNDecoder
    in_channels:
    - 64
    - 128
    - 256
    - 512
    inner_channels: 256
    out_channels: 256
  head:
    _target_: ocr.domains.detection.models.heads.db_head.DBHead
    in_channels: 256
    upscale: 4
    binarization_threshold: 0.3
    expand_ratio: 1.5
  loss:
    _target_: ocr.domains.detection.models.loss.db_loss.DBLoss
    alpha: 1.0
    beta: 10.0
    ohem_ratio: 3.0
train:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
domain:
  task: detection
  batch_size: 16
  skip_test: true
  recognition: null
  max_label_length: null
  charset: null
  decode_mode: null
  beam_width: null
  kie: null
  max_entities: null
  relation_types: null
  entity_categories: null
  linking_mode: null
runtime:
  caching: false
  prefetch: false
  preload_images: false
  preload_maps: false
  prenormalize_images: false
  load_maps: false
  cache_config:
    cache_images: true
    cache_maps: false
    cache_transformed_tensors: false
    log_statistics_every_n: 100
  image_loading_config:
    use_turbojpeg: true
    turbojpeg_fallback: true
