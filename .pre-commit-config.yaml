# This is the standard configuration file for pre-commit hooks.
# It helps catch and fix issues automatically before code is even committed.
# To use, run `pre-commit install` in your local repository.
repos:
  # ============================================================================
  # ARCHITECTURE GUARDIAN - Prevents architectural violations (NEW!)
  # This catches the issues that caused 5 refactors. It persists beyond conversations.
  # ============================================================================
  - repo: local
    hooks:
      - id: architecture-guardian
        name: 🏛️  Python Architecture Guardian (Content)
        entry: uv run python scripts/hooks/verify_python_structure.py
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^\.archive/
        always_run: true
        verbose: true

  # ============================================================================
  # STANDARD CHECKS
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^\.archive/

  # - repo: https://github.com/astral-sh/ruff-pre-commit
