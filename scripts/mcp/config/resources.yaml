# Experiments
- uri: "experiments://agent_interface"
  name: "Experiment Commands"
  path: "dev_tools/experiment_manager/agent_interface.yaml"
  mimeType: "application/x-yaml"

- uri: "experiments://active_list"
  name: "Active Experiments"
  path: null
  mimeType: "application/json"

- uri: "experiments://schemas/manifest"
  name: "Manifest Schema"
  path: "dev_tools/experiment_manager/.schemas/manifest.schema.json"
  mimeType: "application/x-yaml"

# Utility Scripts
- uri: "utilities://quick-reference"
  name: "Utility Scripts Quick Reference"
  description: "ALWAYS CHECK FIRST: Reusable utilities for config loading (2500x faster), paths, timestamps, git"
  path: "scripts/README.md"
  mimeType: "text/markdown"

- uri: "utilities://index"
  name: "Utility Scripts Index"
  description: "Full index of utility modules with triggers, examples, and performance metrics"
  path: "scripts/README.md"
  mimeType: "text/markdown"

# Specs Discovery
- uri: "specs://discovery"
  name: "Specs Discovery Rules"
  description: "Task-to-specs mapping for automatic spec discovery based on task type"
  path: "AgentQMS/specs/tier2-framework/discovery.spec.md"
  mimeType: "text/markdown"

- uri: "specs://frontmatter"
  name: "Frontmatter Schema"
  description: "Frontmatter schema and validation rules"
  path: "AgentQMS/specs/tier1-contracts/validation.spec.md"
  mimeType: "text/markdown"
