name: compliance-check
title: Compliance & Validation Check
ads_version: '1.0'
scope: project
description: 'Context files for running compliance checks, artifact validation,

  and framework boundary validation.

  '
tags:
- compliance
- validation
- check
- audit
- verify
triggers:
  keywords:
  - compliance
  - validate
  - validation
  - check
  - audit
  - verify
  - boundary
  - standard
tiers:
  tier1:
    name: Compliance Essentials
    description: Core compliance standards and rules
    max_files: 8
    files:
    - path: AgentQMS/specs/tier1-contracts/artifact-types.spec.md
      priority: critical
      mode: reference
      description: Artifact type definitions
    - path: AgentQMS/specs/tier1-contracts/compliance.spec.md
      priority: critical
      mode: reference
      description: Naming conventions to validate
    - path: AgentQMS/specs/tier1-contracts/file-placement-rules.spec.md
      priority: high
      mode: reference
      description: File placement rules
    - path: AgentQMS/specs/tier1-contracts/prohibited-actions.spec.md
      priority: high
      mode: reference
      description: Prohibited actions list
  tier2:
    name: Validation Tools
    description: Compliance checking and validation tools
    max_files: 10
    files:
    - path: AgentQMS/tools/compliance/validate_artifacts.py
      priority: critical
      mode: structure
      description: Artifact validation tool
    - path: AgentQMS/tools/compliance/validate_boundaries.py
      priority: high
      mode: structure
      description: Framework boundary validation
    - path: AgentQMS/tools/compliance/monitor_artifacts.py
      priority: high
      mode: structure
      description: Artifact monitoring tool
    - path: AgentQMS/.agentqms/plugins/validators.yaml
      priority: high
      mode: reference
      description: Plugin validators configuration
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: medium
      mode: reference
      description: Tool catalog with validation commands
  tier3:
    name: Framework Standards
    description: Framework standards and configuration
    max_files: 10
    files:
    - path: AgentQMS/specs/tier1-contracts/architecture.spec.md
      priority: medium
      mode: reference
      description: System architecture rules
    - path: AgentQMS/specs/tier1-contracts/workflow-requirements.spec.md
      priority: medium
      mode: reference
      description: Workflow requirements
    - path: AgentQMS/specs/tier2-framework/configuration.spec.md
      priority: low
      mode: reference
      description: Configuration standards
