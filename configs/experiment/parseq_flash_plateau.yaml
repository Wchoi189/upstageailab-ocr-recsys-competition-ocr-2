# @package _global_
# v5.0 Experiment | PARSeq Flash with ReduceLROnPlateau
# ============================================================================
# Based on parseq_flash_wandb with adaptive learning rate scheduling
# ============================================================================

defaults:
  - parseq_flash_wandb
  - /train/scheduler: reduce_on_plateau_acc  # ReduceLROnPlateau for accuracy
  - _self_

# Ensure checkpoint callback state can be restored on resume
trainer:
  enable_checkpointing: true

# Override initial learning rate (will be reduced automatically by scheduler)
train:
  optimizer:
    lr: 2.0e-4  # Start with slightly higher LR, scheduler will reduce it

  callbacks:
    checkpoint:
      _target_: ocr.core.lightning.callbacks.unique_checkpoint.UniqueModelCheckpoint
      dirpath: ${global.paths.checkpoint_dir}
      experiment_tag: ${oc.env:EXPERIMENT_TAG,parseq_flash_plateau}
      training_phase: "training"
      add_timestamp: true
      filename: "best"
      monitor: "val/acc"
      mode: "max"
      save_top_k: 3
      save_last: true
      every_n_train_steps: null
      every_n_epochs: 1
      train_time_interval: null
      save_on_train_epoch_end: false

  # Ensure descriptive run names are generated
  logger:
    wandb:
      standardize_name: true
      log_recognition_images: true  # Log 8 validation samples per epoch
