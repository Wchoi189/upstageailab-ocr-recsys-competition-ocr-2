  #     - id: mypy
  #       # You can customize args and dependencies to match your project's needs
  #       additional_dependencies: [types-Pillow, types-tqdm, types-PyYAML, types-shapely]
  #       files: ^(services/)

  - repo: local
    hooks:
      # - id: frontend-eslint
      #   name: frontend-eslint
      #   entry: npm run lint --workspace playground-console
      #   language: system
      #   pass_filenames: false

      # - id: frontend-type-check
      #   name: frontend-type-check
      #   entry: npm run type-check --workspace playground-console
      #   language: system
      #   pass_filenames: false

      # - id: console-eslint
      #   name: console-eslint
      #   entry: npm run lint --workspace apps/playground-console
      #   language: system
      #   pass_filenames: false

      - id: validate-agentqms-artifacts
        name: validate-agentqms-artifacts
        entry: uv run python -m AgentQMS.cli validate --all
        language: system
        pass_filenames: false
        files: ^docs/artifacts/.*\.md$
        exclude: /(archive|walkthroughs)/

      - id: ads-compliance-check
        name: ADS v2.0 Compliance Check
        entry: uv run python scripts/utils/generate_registry.py
        language: system
        # Regenerate registry when spec files change to keep it in sync
        files: ^AgentQMS/specs/.*\.spec\.md$
        pass_filenames: false
        always_run: false


      - id: arch-guard
        name: 🔍 Hydra Config Audit
        entry: uv run python scripts/audit/audit_hydra_configs.py
        language: system
        files: ^configs/.*\.yaml$
        pass_filenames: false

      - id: validate-feature-first-architecture
        name: 📂 Feature-First Path Validator
        entry: uv run python scripts/hooks/verify_file_layout.py
        language: system
        files: ^ocr/.*\.py$
        pass_filenames: true

      - id: validate-path-usage
        name: Validate Path Usage
        entry: uv run python scripts/hooks/validate_path_usage.py
        language: system
        types: [python]
        exclude: ^\.archive/
        pass_filenames: true
