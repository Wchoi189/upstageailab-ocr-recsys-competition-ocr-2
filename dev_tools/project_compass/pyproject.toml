[project]
name = "project-compass"
version = "0.1.0"
description = "Project Compass - Vessel Pulse Management CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
compass = "project_compass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_compass"]
