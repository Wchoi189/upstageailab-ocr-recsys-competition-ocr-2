name: documentation-update
title: Documentation & Standards Update
ads_version: '1.0'
scope: project
description: 'Context files for updating project documentation, standards, and artifact
  management.

  Includes AgentQMS standards, documentation tools, and artifact templates.

  '
tags:
- documentation
- standards
- artifact
- compliance
- validate
triggers:
  keywords:
  - doc
  - documentation
  - standard
  - artifact
  - compliance
  - validate
  - guide
  - readme
  - changelog
tiers:
  tier1:
    name: Documentation Essentials
    description: Core documentation standards and tools
    max_files: 8
    files:
    - path: AgentQMS/specs/tier1-contracts/artifact-types.spec.md
      priority: critical
      mode: reference
      description: Artifact type definitions
    - path: AgentQMS/specs/tier1-contracts/compliance.spec.md
      priority: critical
      mode: reference
      description: Naming conventions for artifacts and files
    - path: AgentQMS/specs/tier1-contracts/file-placement-rules.spec.md
      priority: high
      mode: reference
      description: File organization rules
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: high
      mode: reference
      description: Available documentation tools and commands
  tier2:
    name: Documentation Framework
    description: Documentation structure and validation tools
    max_files: 10
    files:
    - path: README.md
      priority: high
      mode: reference
      description: Project README
    - path: CHANGELOG.md
      priority: high
      mode: reference
      description: Project changelog
    - path: CONTRIBUTING.md
      priority: medium
      mode: reference
      description: Contribution guidelines
    - path: AgentQMS/tools/compliance/validate_artifacts.py
      priority: medium
      mode: structure
      description: Artifact validation tool
  tier3:
    name: Extended Documentation
    description: Additional documentation resources and templates
    max_files: 8
    files:
    - path: AgentQMS/specs/tier1-contracts/workflow-requirements.spec.md
      priority: low
      mode: reference
      description: Workflow requirements
