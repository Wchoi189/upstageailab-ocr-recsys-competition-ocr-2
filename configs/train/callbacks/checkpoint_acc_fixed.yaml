# @package _group_
# Custom checkpoint configuration for Recognition (Accuracy)
# FIXED VERSION - Better checkpoint management

_target_: ocr.core.lightning.callbacks.unique_checkpoint.UniqueModelCheckpoint
dirpath: ${global.paths.checkpoint_dir}

# Experiment identification
experiment_tag: ${oc.env:EXPERIMENT_TAG,${exp_name}}
training_phase: "training"
add_timestamp: false  # Disable timestamp in filenames (use index-based structure instead)

# Checkpoint naming - metric ALWAYS included
filename: "best"
auto_insert_metric_name: true  # Include metric in filename (e.g., best-acc-0.8620.ckpt)

# Monitoring
monitor: "val/acc"
mode: "max"
save_top_k: 3  # Keep only top 3 checkpoints to save disk space
save_last: "link"  # Use symlink instead of copy to save disk space

# Checkpoint frequency
every_n_epochs: 1
save_on_train_epoch_end: false

# CRITICAL: Disable version counter to prevent v1, v2, v3 suffixes
# The metric value in filename provides uniqueness
enable_version_counter: false

# Minimum score threshold to save (prevents saving checkpoints from failed training)
min_score_threshold: 0.01
