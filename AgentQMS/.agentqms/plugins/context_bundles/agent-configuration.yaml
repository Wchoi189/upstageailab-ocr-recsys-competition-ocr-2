name: agent-configuration
title: Agent Configuration & Settings
ads_version: '1.0'
scope: project
description: AI agent configs (Claude, Copilot, Cursor, Gemini, Ollama)
tags:
- agent
- configuration
- multi-agent
triggers:
  keywords:
  - agent config
  - copilot
  - claude
  - ollama
  - multi-agent
tiers:
  tier1:
    name: Core Config
    max_files: 4
    files:
    - path: AGENTS.yaml
      priority: critical
      mode: full
      description: Agent definitions
    - path: .github/copilot-instructions.md
      priority: high
      mode: reference
      description: Copilot instructions
  tier2:
    name: Framework
    max_files: 4
    files:
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: high
      mode: reference
      description: Tool catalog
    - path: AgentQMS/specs/tier2-framework/agent-infra.spec.md
      priority: high
      mode: full
      description: Ollama model catalog
  tier3:
    name: Extended
    max_files: 4
    files:
    - path: AgentQMS/mcp_schema.yaml
      priority: low
      mode: reference
      description: MCP schema
      optional: true
    - path: experiment_manager/agent_interface.yaml
      priority: low
      mode: reference
      description: Experiment agent interface
      optional: true
