name: agent-configuration
title: Agent Configuration & Settings
ads_version: '1.0'
scope: project
description: 'Context files for configuring AI agents including Claude, Copilot, Cursor,

  Gemini, Ollama models, and custom agent settings for multi-agent systems.

  '
tags:
- agent
- configuration
- settings
- copilot
- claude
- ollama
- models
- multi-agent
triggers:
  keywords:
  - agent
  - config
  - configuration
  - claude
  - copilot
  - cursor
  - gemini
  - qwen
  - settings
  - ai
  - ollama
  - model
  - multi-agent
  - sub-agent
tiers:
  tier1:
    name: Agent Configuration Essentials
    description: Core agent configuration and standards
    max_files: 8
    files:
    - path: AGENTS.yaml
      priority: critical
      mode: full
      description: Agent definitions and configurations
    - path: .github/copilot-instructions.md
      priority: high
      mode: reference
      description: Copilot instructions for this project
  tier2:
    name: Agent Framework
    description: Agent framework and tool integration
    max_files: 8
    files:
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: high
      mode: reference
      description: Available tools for agents
    - path: AgentQMS/mcp_schema.yaml
      priority: medium
      mode: reference
      description: MCP schema definition
      optional: true
    - path: experiment_manager/agent_interface.yaml
      priority: medium
      mode: reference
      description: Agent interface for experiment tools
      optional: true
    - path: AgentQMS/specs/tier2-framework/agent-infra/ollama-models.spec.md
      priority: high
      mode: full
      description: Ollama model catalog for multi-agent systems
  tier3:
    name: Extended Configuration
    description: Additional agent resources and documentation
    max_files: 6
    files:
    - path: README.md
      priority: medium
      mode: reference
      description: Project overview
    - path: AgentQMS/specs/tier1-contracts/workflow-requirements.spec.md
      priority: low
      mode: reference
      description: Workflow requirements
    - path: .qwen/settings.json
      priority: low
      mode: structure
      description: Qwen VLM settings
      optional: true
