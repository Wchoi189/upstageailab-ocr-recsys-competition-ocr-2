hydra:
  run:
    dir: __DEBUG__/recognition_performance_2026-02-09/logs/baseline_run
  sweep:
    dir: ${global.paths.output_dir}/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=__DEBUG__/recognition_performance_2026-02-09/logs/baseline_run
    - hydra.mode=RUN
    task:
    - domain=recognition
    - experiment=rec_baseline_official
    - trainer.max_epochs=1
    - trainer.limit_train_batches=15
    - trainer.limit_val_batches=5
    - data.batch_size=16
  job:
    name: train
    chdir: null
    override_dirname: data.batch_size=16,domain=recognition,experiment=rec_baseline_official,trainer.limit_train_batches=15,trainer.limit_val_batches=5,trainer.max_epochs=1
    id: ???
    num: ???
    config_name: main
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /parent/upstageailab-ocr-recsys-competition-ocr-2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /parent/upstageailab-ocr-recsys-competition-ocr-2/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /parent/upstageailab-ocr-recsys-competition-ocr-2/__DEBUG__/recognition_performance_2026-02-09/logs/baseline_run
    choices:
      experiment: rec_baseline_official
      domain: recognition
      train/optimizer@domain.train.optimizer: adam
      data/datasets@domain.data.datasets: recognition
      hardware: rtx3060
      global: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
