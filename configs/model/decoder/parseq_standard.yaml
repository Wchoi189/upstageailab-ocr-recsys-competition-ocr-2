# @package model.decoder
# v5.0 Standard | Purpose: PARSeq Decoder - Standard Attention, No PLM
# ============================================================================
# Baseline configuration: Standard autoregressive decoding with standard attention

_target_: ocr.domains.recognition.models.decoder.PARSeqDecoder

# Architecture Parameters
d_model: 384
nhead: 12
num_layers: 12
dim_feedforward: 1536
dropout: 0.1

# Sequence Parameters
max_len: 25
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2

# Optimization Features
use_flash_attention: false  # Standard attention
plm_config: null  # No PLM (standard autoregressive)

# Vocab size will be injected from model level
vocab_size: ${model.vocab_size}
