services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # 2026-07-25: migrated off WSL2/Docker Desktop to native Linux.
      # Old /opt/wsl-data (WSL2-side mount) -> new /mnt/ollama-models, its own
      # native ext4 drive (/dev/nbd1p1), already populated (138G, blobs +
      # manifests present, no data recovery from /mnt/docker_data needed --
      # this drive was never part of the Docker Desktop docker_data VHDX).
      - /mnt/ollama-models:/ollama_storage
      # Persist config (keys, etc) in a named volume
      - ollama_config:/root/.ollama
    environment:
      # Allow access from both inside Docker and Windows host
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/ollama_storage
      # 2026-08-16: screenshot (~1100 tok) + canonical prompt (~1185 tok) VLM
      # calls exceed Ollama's 2048-token default num_ctx, causing truncation/
      # empty completions. Raised to 8192. Also pin keep_alive so the model
      # isn't unloaded mid-batch-run (default 5m) -- run one model at a time
      # so this doesn't fight for VRAM on the RTX 3090 (24GB).
      - OLLAMA_NUM_CTX=8192
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
      - shared-db
      - ocr-network
    restart: unless-stopped

volumes:
  ollama_config:

networks:
  # Join the existing OCR project network
  shared-db:
    external: true
    name: ocr-shared-db-net
  ocr-network:
    external: true
    name: ocr-dev_default
