name: security-review
title: Security Review Context Bundle
ads_version: '1.0'
scope: project
description: 'Context files for conducting security-focused code reviews.

  Includes security policies, threat models, and review checklists.

  '
tags:
- security
- review
- compliance
- audit
triggers:
  keywords:
  - security
  - vulnerability
  - audit
  - compliance
  - review
  - threat
  - validation
tiers:
  tier1:
    name: Security Essentials
    description: Core security documentation and policies
    max_files: 5
    files:
    - path: AgentQMS/specs/tier1-contracts/prohibited-actions.spec.md
      priority: critical
      mode: reference
      description: Prohibited actions for safety and security
    - path: AgentQMS/.agentqms/plugins/validators.yaml
      priority: high
      mode: reference
      description: Validation rules including security checks
  tier2:
    name: Review Guidelines
    description: Security review process documentation
    max_files: 5
    files:
    - path: AgentQMS/specs/tier2-framework/api/contracts.spec.md
      priority: medium
      mode: reference
      description: API contracts for secure interfaces
  tier3:
    name: Project Context
    description: Project-specific security context
    max_files: 5
    files:
    - path: README.md
      priority: medium
      mode: reference
      description: Project overview
    - path: AgentQMS/specs/tier1-contracts/architecture.spec.md
      priority: medium
      mode: reference
      description: System architecture for threat surface analysis
