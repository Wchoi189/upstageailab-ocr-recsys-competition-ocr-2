name: ocr-experiment
title: OCR Experiment Management
ads_version: '1.0'
scope: project
description: Experiment tracking and configuration for OCR pipelines
tags:
- experiment
- ocr
- etk
triggers:
  keywords:
  - experiment
  - etk
  - wandb
  - training
tiers:
  tier1:
    name: Experiment Essentials
    max_files: 6
    files:
    - path: experiment_manager/etk.py
      priority: critical
      mode: structure
      description: Experiment Tracker Kernel
    - path: experiment_manager/agent_interface.yaml
      priority: critical
      mode: reference
      description: Agent interface config
    - path: AgentQMS/specs/tier2-framework/discovery.spec.md
      priority: high
      mode: reference
      description: Tool catalog
  tier2:
    name: Configuration
    max_files: 6
    files:
    - path: AgentQMS/specs/tier2-framework/configuration.spec.md
      priority: medium
      mode: reference
      description: Hydra config guide
  tier3:
    name: Extended Context
    max_files: 6
    files:
    - path: experiment_manager/AGENTS.yaml
      priority: low
      mode: reference
      description: Agent configurations
    - path: pyproject.toml
      priority: low
      mode: structure
      description: Project dependencies
    - path: experiment_manager/docs/README.md
      priority: low
      mode: reference
      description: Experiment docs
      optional: true
