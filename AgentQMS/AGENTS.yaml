ads_version: "2.0"
schema_reference: "AgentQMS/specs/schemas/ads_schemas.spec.md"
generated_at: "2026-02-02T05:00:00+0900"
title: "AgentQMS Agents Entrypoint"
description: "Compact index of key AgentQMS resources and commands for AI agents"

resources:
  readme: "AgentQMS/README.md"
  standards_registry: "AgentQMS/.agentqms/registry.yaml"  # Auto-generated from specs
  standards_specs: "AgentQMS/specs/"  # Source of truth
  quickstart: "AgentQMS/specs/tier2-framework/quickstart.spec.md"
  compass_entrypoint: "project_compass/AGENTS.md"
  mcp_server: "AgentQMS/mcp_server.py"
  plugin_snapshot: "AgentQMS/.agentqms/state/plugins.yaml"
  cli: "AgentQMS/cli.py"
  middleware_dashboard: "AgentQMS/tools/middleware/dashboard.py"
  middleware_logs: "outputs/logs/middleware/"
  middleware_metrics: "outputs/metrics/"

commands:
  # Global CLI (when installed via pip/uv)
  init: "aqms init"  # Scaffold .agentqms/ in current directory
  init_force: "aqms init --force"  # Overwrite existing scaffolding
  status: "aqms status"  # Show resolved project/framework roots
  status_json: "aqms status --json"  # Machine-readable status

  # Unified CLI - Canonical module entrypoint
  help: "python -m AgentQMS.cli --help"
  validate_all: "python -m AgentQMS.cli validate --all"
  validate_file: "python -m AgentQMS.cli validate --file <path>"
  monitor_check: "python -m AgentQMS.cli monitor --check"
  monitor_report: "python -m AgentQMS.cli monitor --report"
  artifact_create: "python -m AgentQMS.cli artifact create --type <type> --name <name> --title \"<title>\""
  artifact_validate: "python -m AgentQMS.cli artifact validate --all"
  generate_config: "python -m AgentQMS.cli generate-config --path <current_path>"
  qms_feedback_report: "python -m AgentQMS.cli feedback report --issue-type <type> --description \"<desc>\""
  qms_quality_check: "python -m AgentQMS.cli quality --check"
  qms_token_analysis: "python AgentQMS/bin/monitor-token-usage.py"

  # Registry Management (Phase 7.2)
  registry_sync: "python -m AgentQMS.cli registry sync"  # Generates from specs
  registry_resolve: "python -m AgentQMS.cli registry resolve --task <task>"

  # Middleware Observability (Phase C)
  middleware_health: "make qms-middleware-health"
  middleware_dashboard: "make qms-middleware-dashboard"
  middleware_stats: "uv run python AgentQMS/tools/middleware/dashboard.py --json"
  middleware_logs: "make qms-middleware-logs"

environment:
  AGENTQMS_PROJECT_ROOT: "Override project root detection (absolute or relative path)"

context_bundles:
  - name: "compliance-check"
    path: "AgentQMS/.agentqms/plugins/context_bundles/compliance-check.yaml"
  - name: "documentation-update"
    path: "AgentQMS/.agentqms/plugins/context_bundles/documentation-update.yaml"
  - name: "hydra-configuration"
    path: "AgentQMS/.agentqms/plugins/context_bundles/hydra-configuration.yaml"
  - name: "ocr-experiment"
    path: "AgentQMS/.agentqms/plugins/context_bundles/ocr-experiment.yaml"

