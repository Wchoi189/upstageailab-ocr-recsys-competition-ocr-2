# AST Debugging Tools Context Bundle Plugin

name: ast-debugging-tools
title: AST Analysis & Code Intelligence Tools
ads_version: "1.0"
scope: project
description: |
  Advanced code analysis tools using AST parsing, static analysis, and intelligent
  search. These tools are MORE POWERFUL than basic grep/find but often underutilized
  by AI agents. Auto-suggest when analyzing config patterns, Hydra usage, dependencies,
  or navigating unfamiliar code.

tags:
  - ast
  - debugging
  - code analysis
  - hydra
  - config
  - static analysis
  - dependency graph
  - code intelligence

triggers:
  keywords:
    # Config analysis
    - config usage
    - find config
    - cfg.
    - config['
    - config access
    - config patterns
    - where is config used

    # Batch Editing / Refactoring
    - batch edit
    - bulk update
    - yaml refactor
    - fix all configs
    - update target
    - yq

    # Hydra analysis
    - hydra usage
    - instantiate
    - '@hydra.main'
    - hydra decorator
    - omegaconf
    - merge order
    - config merge
    - merge precedence

    # Code navigation
    - find class
    - find function
    - where is defined
    - locate symbol
    - find implementation
    - symbol search
    - code search

    # Dependency analysis
    - import graph
    - dependency graph
    - what imports
    - what calls
    - dependency tree

    # Code structure
    - code complexity
    - cyclomatic complexity
    - directory structure
    - module overview
    - context tree
    - semantic tree

    # Component patterns
    - factory pattern
    - component instantiation
    - get_X_by_cfg
    - instantiate_

  patterns:
    - "find.*config"
    - "hydra.*usage"
    - "where.*defined"
    - "dependency.*graph"
    - "code.*complexity"
    - "analyze.*imports"
    - "search.*symbol"
    - "module.*structure"

tiers:
  tier1:
    name: Core AST Tools & Quick Reference
    description: Essential tools and usage guide (ALWAYS LOAD for debugging)
    max_files: 3
    files:
      - path: dev_tools/agent_debug_toolkit/AI_USAGE.yaml
        priority: critical
        mode: reference
        description: Complete tool reference with examples and best practices
      - path: AgentQMS/specs/tier2-framework/discovery.spec.md
        priority: high
        mode: reference
        description: All available tools including AST commands
      - path: dev_tools/agent_debug_toolkit/README.md
        priority: medium
        mode: reference
        description: Installation and architecture overview

notes:
  created: "2026-01-20"
  updated: "2026-02-03"
  motivation: "AI agents underutilize powerful AST tools due to unfamiliarity with CLI commands and use cases"
  goal: "Auto-suggest AST tools in appropriate scenarios without explicit user instruction"
  documentation_source: "dev_tools/agent_debug_toolkit/AI_USAGE.yaml"
